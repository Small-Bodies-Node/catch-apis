version: "3.8"

services:
  apis:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: catch-prod
    command: ./_entrypoint_webapp_prod
    tty: true
    ports:
      - "127.0.0.1:${API_PORT}:${API_PORT}"
    env_file:
      - ./.env
    depends_on:
      - redis-server
    restart: unless-stopped
  worqer-prod:
    image: catch-prod
    deploy:
      replicas: ${CATCH_QUEUE_WORKER_INSTANCES}
    command: ./_entrypoint_woRQer_prod
    depends_on:
      - redis-server
      - apis
    restart: unless-stopped
    env_file:
      - ./.env
  redis-server:
    image: redis:5
    restart: unless-stopped
